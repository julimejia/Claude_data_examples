[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemasentinel"
version = "0.1.0"
description = "Detects schema drift between dataset versions, classifies it and proposes DDL migrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "duckdb>=1",
    "deltalake>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
